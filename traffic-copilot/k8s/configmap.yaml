apiVersion: v1
kind: ConfigMap
metadata:
  name: trafficcopilot-config
  namespace: trafficcopilot
  labels:
    app.kubernetes.io/name: trafficcopilot
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka.trafficcopilot.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP_ID: "trafficcopilot-api"

  # LLM
  GROQ_MODEL: "llama-3.3-70b-versatile"
  LLM_TEMPERATURE: "0.1"
  LLM_MAX_TOKENS: "2048"

  # OSM routing
  OSM_PLACE_NAME: "Manhattan, New York, USA"
  OSM_GRAPH_CACHE: "/app/data/processed/graph.gpickle"

  # Detection
  DETECTION_CONFIDENCE_THRESHOLD: "0.5"

  # Prompts
  PROMPTS_DIR: "/app/prompts"
