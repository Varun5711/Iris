# Example Kubernetes Secret manifest for TrafficCopilot.
#
# DO NOT commit real credentials to version control.
# Copy this file, fill in real base64-encoded values, and apply with:
#
#   kubectl apply -f k8s/secrets.yaml -n trafficcopilot
#
# To encode a value:
#   echo -n "your_value_here" | base64
#
# To decode a value:
#   echo "base64string" | base64 --decode

apiVersion: v1
kind: Secret
metadata:
  name: trafficcopilot-secrets
  namespace: trafficcopilot
  labels:
    app.kubernetes.io/name: trafficcopilot
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # GROQ_API_KEY — your Groq API key (gsk_...)
  # Plaintext example: gsk_placeholder_replace_me
  GROQ_API_KEY: Z3NrX3BsYWNlaG9sZGVyX3JlcGxhY2VfbWU=

  # DATABASE_URL — full asyncpg connection string
  # Plaintext example: postgresql+asyncpg://tc:tc_secret@postgres:5432/trafficcopilot
  DATABASE_URL: cG9zdGdyZXNxbCthc3luY3BnOi8vdGM6dGNfc2VjcmV0QHBvc3RncmVzOjU0MzIvdHJhZmZpY2NvcGlsb3Q=

  # SECRET_KEY — JWT signing secret (use a strong random value in production)
  # Plaintext example: change_me_in_production
  SECRET_KEY: Y2hhbmdlX21lX2luX3Byb2R1Y3Rpb24=

  # POSTGRES_USER — PostgreSQL superuser name
  # Plaintext example: tc
  POSTGRES_USER: dGM=

  # POSTGRES_PASSWORD — PostgreSQL superuser password
  # Plaintext example: tc_secret
  POSTGRES_PASSWORD: dGNfc2VjcmV0

  # REDIS_URL — Redis connection string
  # Plaintext example: redis://redis:6379/0
  REDIS_URL: cmVkaXM6Ly9yZWRpczozNjc5LzA=
