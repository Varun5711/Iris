
[alembic]
# Path to migration scripts, relative to this file
script_location = src/db/migrations

# Template for auto-generated revision filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for revision timestamps (leave empty to use UTC)
timezone =

# Max length of slug component in revision filenames
truncate_slug_length = 40

# Revision environment
revision_environment = false

# The SQLAlchemy connection URL is read from the DATABASE_URL environment
# variable at runtime inside src/db/migrations/env.py — do not hard-code it
# here. The line below acts as a fallback placeholder only and is overridden
# by env.py.
sqlalchemy.url = postgresql+asyncpg://tc:tc_secret@postgres:5432/trafficcopilot

[post_write_hooks]
# Run ruff format on newly generated migration files
hooks = ruff
ruff.type = exec
ruff.executable = %(here)s/.venv/bin/ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
